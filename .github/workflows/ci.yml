name: ci

on:
    push:
        branches:
            - main
            - master
    pull_request:

jobs:
    check:
        runs-on: ubuntu-24.04

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_DB: my_database
                    POSTGRES_USER: my_user
                    POSTGRES_PASSWORD: change-me
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        env:
            DATABASE_URL: postgresql://my_user:change-me@127.0.0.1:5432/my_database?serverVersion=16

        steps:
            -   uses: actions/checkout@v6

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.5'
                    extensions: sodium, pdo_pgsql
                    coverage: none

            -   name: Install dependencies
                run: composer install --no-interaction --no-progress

            -   name: ECS
                run: composer bin-ecs

            -   name: Rector
                run: composer bin-rector

            -   name: PHPStan
                run: composer bin-phpstan

            -   name: PHPUnit
                run: vendor-bin/phpunit/vendor/bin/phpunit

    # The same suite against MariaDB (10.6 matches the shared-hosting
    # variant): validates the plugin's database models on both platforms.
    # Connects as root because the test bootstrap runs CREATE DATABASE.
    mariadb:
        runs-on: ubuntu-24.04

        services:
            mariadb:
                image: mariadb:10.6
                env:
                    MARIADB_DATABASE: my_database
                    MARIADB_ROOT_PASSWORD: my_root_password
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd "healthcheck.sh --connect --innodb_initialized"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 10

        env:
            DATABASE_URL: mysql://root:my_root_password@127.0.0.1:3306/my_database?serverVersion=10.6.23-MariaDB&charset=utf8mb4

        steps:
            -   uses: actions/checkout@v6

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.5'
                    extensions: sodium, pdo_mysql
                    coverage: none

            -   name: Install dependencies
                run: composer install --no-interaction --no-progress

            -   name: PHPUnit
                run: vendor-bin/phpunit/vendor/bin/phpunit
